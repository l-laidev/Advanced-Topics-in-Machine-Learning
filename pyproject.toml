[project]
name = "atml-repo"
version = "0.1.0"
description = "Advanced Topics in Machine Learning course repo"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "torchvision (>=0.28.0,<0.29.0)",
    "tqdm (>=4.70.0,<5.0.0)",
    "ipywidgets (>=8.1.8,<9.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "umap-learn (>=0.5.12,<0.6.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "transformers (>=5.14.1,<6.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "datasets (>=5.0.1,<6.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "widgetsnbextension (>=4.0.15,<5.0.0)",
    "jupyterlab-widgets (>=3.0.16,<4.0.0)",
    "ftfy (>=6.3.1,<7.0.0)",
    "regex (>=2026.7.19,<2027.0.0)",
    "clip @ git+https://github.com/openai/CLIP.git",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
